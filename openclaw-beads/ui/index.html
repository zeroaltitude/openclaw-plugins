<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Beads — DAG</title>
  <style>
    * { box-sizing: border-box; }
    html, body, #root { height: 100%; margin: 0; padding: 0; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #0c0d0f; color: #e5e7eb; }
    button, input, textarea, select { font: inherit; color: inherit; }

    .topbar { display: flex; align-items: center; gap: 12px; padding: 8px 16px; border-bottom: 1px solid #1f2937; background: #11131a; height: 49px; }
    .topbar h1 { font-size: 14px; font-weight: 600; margin: 0; letter-spacing: 0.02em; }
    .topbar select { background: #0c0d0f; color: #e5e7eb; border: 1px solid #374151; border-radius: 6px; padding: 4px 8px; font-size: 13px; }
    .topbar .stat { font-size: 12px; color: #9ca3af; }
    .topbar .check { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: #9ca3af; user-select: none; }
    .topbar .check input { margin: 0; accent-color: #3b82f6; }
    .topbar .err-pill { color: #fca5a5; font-size: 12px; padding: 2px 8px; border: 1px solid #7f1d1d; border-radius: 4px; cursor: help; max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .topbar .spacer { flex: 1; }
    .topbar .api-links { display: flex; gap: 6px; font-size: 11px; }
    .topbar .api-links a { color: #93c5fd; text-decoration: none; padding: 2px 6px; border: 1px solid #1f2937; border-radius: 4px; font-family: ui-monospace, SFMono-Regular, monospace; }
    .topbar .api-links a:hover { background: #1f2937; color: #dbeafe; }
    .topbar .new-btn { background: #1e40af; color: white; border: 1px solid #2563eb; border-radius: 6px; padding: 4px 12px; font-size: 13px; font-weight: 500; cursor: pointer; }
    .topbar .new-btn:hover { background: #2563eb; }
    .topbar .work-btn { background: #0c0d0f; color: #bfdbfe; border: 1px solid #1e3a8a; border-radius: 6px; padding: 4px 12px; font-size: 13px; font-weight: 500; cursor: pointer; }
    .topbar .work-btn:hover { background: #172554; color: #dbeafe; }
    .topbar .ver { font-size: 10px; color: #4b5563; font-family: ui-monospace, SFMono-Regular, monospace; padding: 2px 6px; border: 1px solid #1f2937; border-radius: 4px; }

    .err-banner { position: absolute; left: 16px; right: 16px; top: 60px; background: #1f0d0d; border: 1px solid #7f1d1d; border-radius: 6px; padding: 10px 14px; font-size: 12px; color: #fecaca; font-family: ui-monospace, SFMono-Regular, monospace; white-space: pre-wrap; word-break: break-word; max-height: 240px; overflow-y: auto; z-index: 10; }
    .err-banner button { float: right; background: transparent; color: #fca5a5; border: 1px solid #7f1d1d; border-radius: 4px; padding: 2px 8px; cursor: pointer; font-size: 11px; margin-left: 8px; }
    .err-banner .retry { color: #93c5fd; border-color: #1e40af; }

    .main { position: absolute; inset: 49px 0 0 0; display: flex; }
    .canvas-wrap { flex: 1; overflow: hidden; position: relative; }
    .empty { padding: 32px; color: #9ca3af; }
    .legend { position: absolute; right: 16px; bottom: 16px; padding: 8px 10px; background: #11131a; border: 1px solid #1f2937; border-radius: 6px; font-size: 11px; line-height: 1.5; z-index: 1; }
    .legend .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }

    .detail { width: 420px; flex-shrink: 0; border-left: 1px solid #1f2937; background: #0f1117; overflow-y: auto; padding: 16px; }
    .detail .close-x { float: right; background: transparent; color: #9ca3af; border: none; font-size: 20px; cursor: pointer; line-height: 1; padding: 0 4px; }
    .detail .close-x:hover { color: #e5e7eb; }
    .detail .id { font-family: ui-monospace, SFMono-Regular, monospace; color: #93c5fd; font-size: 12px; }
    .detail h2 { font-size: 16px; margin: 6px 0 8px; }
    .detail .meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 11px; color: #9ca3af; margin: 8px 0 12px; }
    .detail .meta span { display: inline-flex; align-items: center; min-height: 26px; padding: 0 8px; border: 1px solid #1f2937; border-radius: 4px; background: #0c0d0f; line-height: 1; }
    .detail .meta select { width: auto; display: inline-flex; min-height: 26px; margin-top: 0; padding: 0 28px 0 8px; font-size: 11px; line-height: 1; border-radius: 4px; }
    .detail .desc { font-size: 13px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; padding: 12px; background: #0c0d0f; border: 1px solid #1f2937; border-radius: 6px; max-height: 300px; overflow-y: auto; }
    .detail input, .detail textarea, .detail select { width: 100%; background: #0c0d0f; color: #e5e7eb; border: 1px solid #374151; border-radius: 6px; padding: 6px 10px; font-size: 13px; margin-top: 4px; }
    .detail textarea { min-height: 120px; font-family: ui-monospace, SFMono-Regular, monospace; resize: vertical; }
    .detail label { font-size: 11px; color: #9ca3af; display: block; margin-top: 10px; }
    .detail .actions { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
    .detail .actions button { padding: 6px 12px; border-radius: 6px; border: 1px solid #374151; background: #1f2937; color: #e5e7eb; cursor: pointer; font-size: 12px; }
    .detail .actions button:hover { background: #374151; }
    .detail .actions .primary { background: #1e40af; border-color: #2563eb; }
    .detail .actions .primary:hover { background: #2563eb; }
    .detail .actions .danger { background: #7f1d1d; border-color: #b91c1c; }
    .detail .actions .danger:hover { background: #b91c1c; }
    .detail .saving { font-size: 11px; color: #fbbf24; }
    .detail .deps { margin-top: 16px; padding: 12px; background: #0c0d0f; border: 1px solid #1f2937; border-radius: 6px; }
    .detail .deps h3 { font-size: 12px; margin: 0 0 6px; color: #9ca3af; font-weight: 500; text-transform: uppercase; letter-spacing: 0.05em; }
    .detail .dep-row { display: flex; align-items: center; gap: 6px; font-size: 12px; padding: 4px 0; font-family: ui-monospace, SFMono-Regular, monospace; }
    .detail .dep-row a { color: #93c5fd; text-decoration: none; cursor: pointer; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .detail .dep-row a:hover { text-decoration: underline; }
    .detail .dep-row .x { color: #fca5a5; cursor: pointer; padding: 0 6px; border: 1px solid #7f1d1d; border-radius: 4px; font-size: 11px; background: transparent; }
    .detail .dep-row .x:hover { background: #7f1d1d; color: white; }
    .detail .dep-empty { color: #6b7280; font-size: 11px; font-style: italic; padding: 4px 0; }
    .detail .add-dep { margin-top: 8px; display: flex; gap: 4px; }
    .detail .add-dep select { flex: 1; }
    .detail .add-dep button { padding: 4px 12px; border-radius: 6px; border: 1px solid #2563eb; background: #1e40af; color: white; cursor: pointer; font-size: 11px; }
    .detail .add-dep button:hover { background: #2563eb; }
    .detail .add-dep button:disabled { background: #374151; border-color: #4b5563; cursor: not-allowed; }

    .modal-bg { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.7); z-index: 100; display: flex; align-items: center; justify-content: center; }
    .modal { background: #11131a; border: 1px solid #1f2937; border-radius: 8px; padding: 24px; min-width: 480px; max-width: 600px; max-height: 80vh; overflow-y: auto; }
    .modal h2 { margin: 0 0 16px; font-size: 16px; }
    .modal label { display: block; font-size: 11px; color: #9ca3af; margin-top: 12px; }
    .modal input, .modal textarea, .modal select { width: 100%; background: #0c0d0f; color: #e5e7eb; border: 1px solid #374151; border-radius: 6px; padding: 8px 10px; font-size: 13px; margin-top: 4px; }
    .modal textarea { min-height: 140px; font-family: ui-monospace, SFMono-Regular, monospace; resize: vertical; }
    .modal .row { display: flex; gap: 12px; }
    .modal .row > * { flex: 1; }
    .modal .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
    .modal .actions button { padding: 8px 16px; border-radius: 6px; border: 1px solid #374151; background: #1f2937; color: #e5e7eb; cursor: pointer; font-size: 13px; }
    .modal .actions .primary { background: #1e40af; border-color: #2563eb; }
    .active-modal { min-width: min(1100px, 92vw); max-width: 92vw; }
    /* Three-row grid: project header / active / blocked. Columns are repos.
       Each row gets a subtle tinted background to separate the lanes;
       cells inside each row align horizontally across all repos. */
    .active-grid {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: 280px;
      grid-template-rows:
        [project] auto
        [active] minmax(140px, auto)
        [blocked] minmax(140px, auto);
      gap: 6px 8px;
      overflow-x: auto;
      padding: 8px 4px 4px;
      align-items: stretch;
    }
    /* Per-row background tints — applied via cell decorators since CSS Grid
       can't paint a row directly without subgrid in widely-shipping browsers. */
    .active-cell { padding: 8px; border-radius: 6px; border: 1px solid #1f2937; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
    .active-cell.row-project  { background: rgba( 96, 165, 250, 0.08); border-color: rgba( 96, 165, 250, 0.20); }
    .active-cell.row-active   { background: rgba( 34, 197,  94, 0.07); border-color: rgba( 34, 197,  94, 0.20); }
    .active-cell.row-blocked  { background: rgba(239,  68,  68, 0.06); border-color: rgba(239,  68,  68, 0.18); }
    .active-row-label { font-size: 9px; color: #6b7280; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 2px; }
    .active-list { display: flex; flex-direction: column; gap: 6px; }
    .active-section-title { margin-top: 2px; color: #6b7280; font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; text-align: left; }
    .active-section-title.behind { color: #f59e0b; }
    .active-card.behind { opacity: 0.78; border-style: dashed; }
    .active-section-title.stuck { color: #c084fc; }
    .active-card.stuck { opacity: 0.85; border-style: dotted; border-color: #6d28d9; }
    .active-card.stuck .active-meta .stuck-status { color: #c4b5fd; font-weight: 600; }
    .active-repo { text-align: left; color: #93c5fd; font-family: ui-monospace, SFMono-Regular, monospace; font-size: 12px; padding: 4px 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .active-card { min-height: 112px; height: 100%; padding: 10px; border-radius: 8px; border: 1px solid #374151; background: #0f1117; cursor: pointer; display: flex; flex-direction: column; gap: 6px; }
    .active-card:hover { border-color: #60a5fa; background: #111827; }
    .active-card.empty { cursor: default; color: #6b7280; justify-content: center; text-align: center; font-style: italic; }
    .active-card.empty:hover { border-color: #374151; background: #0f1117; }
    .active-id { color: #93c5fd; font-family: ui-monospace, SFMono-Regular, monospace; font-size: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .active-title { color: #e5e7eb; font-size: 11px; line-height: 1.25; min-height: 28px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .active-meta { display: flex; gap: 4px; flex-wrap: wrap; font-size: 9px; color: #9ca3af; }
    .active-meta span { padding: 2px 6px; border: 1px solid #1f2937; border-radius: 4px; background: #0c0d0f; }

    .node-card { background: #11131a; border: 2px solid var(--status-color, #3b82f6); border-radius: 4px; padding: 5px 9px; height: 100%; display: flex; flex-direction: column; justify-content: center; cursor: pointer; pointer-events: auto; position: relative; }
    .node-card:hover { background: #1a1d27; box-shadow: 0 0 0 1px var(--status-color, #3b82f6); }
    .node-card.selected { outline: 2px solid #93c5fd; outline-offset: -2px; }
    .node-card.drop-valid { outline: 2px dashed #22c55e; outline-offset: -2px; background: #0a1f12; }
    .node-card.drop-invalid { outline: 2px dashed #4b5563; outline-offset: -2px; opacity: 0.4; }
    @keyframes node-flash { 0% { box-shadow: 0 0 0 2px #fbbf24, 0 0 16px 4px rgba(251,191,36,0.55); } 100% { box-shadow: 0 0 0 0 transparent; } }
    .node-card.changed { animation: node-flash 4s ease-out 1; }
    .topbar .sync-pill { font-size: 11px; color: #9ca3af; padding: 2px 8px; border: 1px solid #1f2937; border-radius: 4px; font-family: ui-monospace, SFMono-Regular, monospace; }
    .topbar .sync-pill.fresh { color: #6ee7b7; border-color: #065f46; }
    .topbar .sync-pill.stale { color: #fbbf24; border-color: #78350f; }
    .node-card .node-owner { font-size: 10px; color: #9ca3af; margin-top: 3px; font-family: ui-monospace, SFMono-Regular, monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .node-card .node-owner.unset { color: #6b7280; font-style: italic; }
    .link-anchor {
      position: absolute;
      right: 4px;
      top: 50%;
      transform: translateY(-50%);
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #3b82f6;
      border: 2px solid #0c0d0f;
      cursor: grab;
      box-shadow: 0 0 0 2px #11131a, 0 0 8px rgba(59, 130, 246, 0.7);
      z-index: 5;
    }
    .link-anchor:hover { background: #60a5fa; }
    .link-anchor:active { cursor: grabbing; background: #93c5fd; }
    .node-card .node-id { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 10px; color: #93c5fd; }
    .node-card .node-title { font-size: 11px; color: #e5e7eb; margin-top: 2px; line-height: 1.3; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.3.1",
      "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
      "reaflow": "https://esm.sh/reaflow@5.3.4?deps=react@18.3.1,react-dom@18.3.1"
    }
  }
  </script>
</head>
<body>
  <div id="root"><div class="empty">Loading…</div></div>

  <script type="module">
    import React, { useEffect, useMemo, useState, useCallback, useRef } from "react";
    import { createRoot } from "react-dom/client";
    import { Canvas, Node as ReaNode, Edge as ReaEdge } from "reaflow";

    const STATUS_COLORS = {
      open:                        "#22c55e", // green
      in_progress:                 "#3b82f6", // blue
      waiting_for_user:            "#fdba74", // light orange
      waiting_for_available_agent: "#ea580c", // dark orange
      blocked:                     "#ef4444", // red
      closed:                      "#6b7280", // gray
      deferred:                    "#eab308", // yellow
    };
    const colorForStatus = (s) => STATUS_COLORS[String(s ?? "open").toLowerCase()] ?? "#22c55e";

    const ISSUE_TYPES = ["task", "bug", "feature", "epic", "chore", "decision"];
    const STATUSES = ["open", "in_progress", "waiting_for_user", "waiting_for_available_agent", "blocked", "closed", "deferred"];
    const DEFAULT_OWNER_OPTIONS = ["any", "eddie", "main", "tank", "narcissus", "smith", "shiva"];
    const labelForStatus = (s) => String(s || "").replace(/_/g, " ");
    const pathRepoFromLocation = () => {
      const parts = window.location.pathname.split("/").filter(Boolean);
      if (parts[0] !== "beads" || !parts[1] || parts[1] === "api") return null;
      try { return decodeURIComponent(parts[1]); } catch { return parts[1]; }
    };
    const urlForRepo = (repo) => repo ? `/beads/${encodeURIComponent(repo)}` : "/beads";
    const REFERENCE_LABEL_PREFIX = "ref:";
    const LEGACY_MEMORY_LABEL_PREFIX = "memory:";
    const referencesFromLabels = (labels) => {
      if (!Array.isArray(labels)) return [];
      const out = [];
      for (const l of labels) {
        if (typeof l !== "string") continue;
        if (l.startsWith(REFERENCE_LABEL_PREFIX)) {
          const v = l.slice(REFERENCE_LABEL_PREFIX.length);
          if (v) out.push(v);
        } else if (l.startsWith(LEGACY_MEMORY_LABEL_PREFIX)) {
          const v = l.slice(LEGACY_MEMORY_LABEL_PREFIX.length);
          if (v) out.push(v);
        }
      }
      return out;
    };
    const parseReferencesText = (text) =>
      String(text || "")
        .split(/[\n,]/)
        .map((s) => s.trim())
        .filter(Boolean);
    const targetDateTimeOf = (issue) =>
      issue?.target_datetime || issue?.targetDatetime || issue?.metadata?.target_datetime || issue?.due_at || "";
    const PRIORITIES = [
      { v: "0", label: "P0 (highest)" },
      { v: "1", label: "P1" },
      { v: "2", label: "P2" },
      { v: "3", label: "P3" },
      { v: "4", label: "P4 (lowest)" },
    ];

    function App() {
      const [repos, setRepos] = useState([]);
      const [ownerOptions, setOwnerOptions] = useState(DEFAULT_OWNER_OPTIONS);
      const [selectedRepo, setSelectedRepo] = useState(null);
      const [issues, setIssues] = useState([]);
      const [edges, setEdges] = useState([]);
      const [error, setError] = useState(null);
      const [loading, setLoading] = useState(true);
      const [selectedId, setSelectedId] = useState(null);
      const [creating, setCreating] = useState(false);
      const [showActiveWork, setShowActiveWork] = useState(false);
      const [reloadKey, setReloadKey] = useState(0);
      const [showClosed, setShowClosed] = useState(false);
      const [pollIntervalSec, setPollIntervalSec] = useState(() => {
        const v = Number(localStorage.getItem("beads.pollIntervalSec"));
        return Number.isFinite(v) && v >= 0 ? v : 60;
      });
      const [lastSyncedAt, setLastSyncedAt] = useState(null);
      const [syncTick, setSyncTick] = useState(0);
      const [recentlyChangedIds, setRecentlyChangedIds] = useState(() => new Set());
      const prevIssuesRef = useRef(new Map());

      // Per-repo persisted view state (zoom + pan translate). Restored on
      // repo switch / page reload so syncs don't disturb the view.
      const VIEW_STORE_KEY = (repo) => `beads.view.v1.${repo}`;
      const readSavedView = (repo) => {
        if (!repo) return null;
        try {
          const raw = localStorage.getItem(VIEW_STORE_KEY(repo));
          if (!raw) return null;
          const v = JSON.parse(raw);
          if (!v || typeof v !== "object") return null;
          const zoom = Number(v.zoom);
          const x = Number(v.x);
          const y = Number(v.y);
          return {
            zoom: Number.isFinite(zoom) ? zoom : null,
            x: Number.isFinite(x) ? x : null,
            y: Number.isFinite(y) ? y : null,
          };
        } catch {
          return null;
        }
      };
      const writeSavedView = (repo, patch) => {
        if (!repo) return;
        try {
          const cur = readSavedView(repo) || {};
          const next = { ...cur, ...patch };
          localStorage.setItem(VIEW_STORE_KEY(repo), JSON.stringify(next));
        } catch { /* best-effort */ }
      };
      const [initialZoom, setInitialZoom] = useState(null);
      const [initialPan, setInitialPan] = useState(null);
      // When the repo changes, snapshot the saved view so the Canvas mounts
      // with that initial zoom/pan and `fit` only fires on first-ever view.
      useEffect(() => {
        if (!selectedRepo) { setInitialZoom(null); setInitialPan(null); return; }
        const v = readSavedView(selectedRepo);
        setInitialZoom(v && Number.isFinite(v.zoom) ? v.zoom : null);
        setInitialPan(v && Number.isFinite(v.x) && Number.isFinite(v.y) ? { x: v.x, y: v.y } : null);
      }, [selectedRepo]);

      // Reaflow renders an inner <g> under canvasRef.current.svgRef whose
      // transform attribute contains "translate(x, y) scale(zoom)" applied
      // by drag-pan. We piggy-back on that: a MutationObserver captures the
      // current translate values whenever the user pans/zooms, persisting
      // them per-repo. After mount with a saved pan, we apply it once.
      useEffect(() => {
        if (!selectedRepo) return undefined;
        const wrap = canvasWrapRef.current;
        if (!wrap) return undefined;
        let cancelled = false;
        let observer = null;
        let saveTimer = null;
        let appliedPan = false;
        const findInnerG = () => wrap.querySelector("svg > g");
        const parseTranslate = (transform) => {
          if (typeof transform !== "string") return null;
          const m = /translate\(\s*(-?\d+(?:\.\d+)?)\s*[, ]\s*(-?\d+(?:\.\d+)?)/.exec(transform);
          if (!m) return null;
          return { x: parseFloat(m[1]), y: parseFloat(m[2]) };
        };
        const captureAndSave = () => {
          const g = findInnerG();
          if (!g) return;
          const t = parseTranslate(g.getAttribute("transform"));
          if (!t) return;
          if (saveTimer) clearTimeout(saveTimer);
          saveTimer = setTimeout(() => {
            if (cancelled) return;
            writeSavedView(selectedRepo, { x: t.x, y: t.y });
          }, 250);
        };
        const tryApplyInitialPan = () => {
          if (appliedPan || !initialPan) return false;
          const g = findInnerG();
          if (!g) return false;
          const cur = g.getAttribute("transform") || "";
          // Replace the translate(...) prefix; preserve any scale(...) suffix.
          const scaleMatch = /scale\([^)]+\)/.exec(cur);
          const scalePart = scaleMatch ? " " + scaleMatch[0] : "";
          g.setAttribute(
            "transform",
            `translate(${initialPan.x}, ${initialPan.y})${scalePart}`,
          );
          appliedPan = true;
          return true;
        };
        // Apply initial pan once the SVG group exists. Try a few times since
        // reaflow lays out asynchronously.
        const attachWhenReady = (attempts = 0) => {
          if (cancelled) return;
          const g = findInnerG();
          if (!g) {
            if (attempts < 30) setTimeout(() => attachWhenReady(attempts + 1), 100);
            return;
          }
          tryApplyInitialPan();
          observer = new MutationObserver(() => {
            if (cancelled) return;
            captureAndSave();
          });
          observer.observe(g, { attributes: true, attributeFilter: ["transform"] });
        };
        attachWhenReady();
        return () => {
          cancelled = true;
          if (saveTimer) clearTimeout(saveTimer);
          if (observer) observer.disconnect();
        };
        // Re-bind whenever the repo changes or when initialPan shifts (i.e.,
        // after the saved-view snapshot for a new repo).
      }, [selectedRepo, initialPan]);
      const canvasWrapRef = useRef(null);
      const canvasRef = useRef(null);

      useEffect(() => {
        fetch("/beads/api/repos")

    function ActiveWorkModal({ onClose, onOpenRepo, pollIntervalSec }) {
      const [data, setData] = useState(null);
      const [err, setErr] = useState(null);
      const [tick, setTick] = useState(0);

      useEffect(() => {
        let cancelled = false;
        const load = () => {
          fetch("/beads/api/ready?limit=4")
            .then((r) => r.json())
            .then((j) => {
              if (j.error) throw new Error(j.error);
              if (!cancelled) {
                setData(j.repos || []);
                setErr(null);
              }
            })
            .catch((e) => {
              if (!cancelled) setErr(String(e?.message ?? e));
            });
        };
        load();
        // Auto-refresh on the same cadence as the main view, so the
        // dashboard stays current while the modal is open.
        const intervalSec = Math.max(5, Number(pollIntervalSec) || 0);
        let id = null;
        if (intervalSec > 0) {
          id = setInterval(() => {
            if (document.hidden) return;
            load();
            setTick((t) => t + 1);
          }, intervalSec * 1000);
        }
        return () => {
          cancelled = true;
          if (id) clearInterval(id);
        };
      }, [pollIntervalSec]);

      return React.createElement(
        "div",
        { className: "modal-bg", onClick: onClose },
        React.createElement(
          "div",
          { className: "modal active-modal", onClick: (e) => e.stopPropagation() },
          React.createElement("h2", null, "Active work"),
          React.createElement(
            "div",
            { style: { color: "#9ca3af", fontSize: 12, marginBottom: 8 } },
            "Ready issues per configured repo. Click a card to switch to that repo.",
          ),
          err && React.createElement("div", { style: { color: "#fca5a5", fontSize: 12 } }, err),
          !data
            ? React.createElement("div", { className: "empty" }, "Loading active work…")

              ? React.createElement("div", { className: "empty" }, "No configured non-test repos")
              : React.createElement(
                  "div",
                  { className: "active-grid" },
                  // Row-major emission: for each repo we push three cells in
                  // grid-auto-flow: column order — project header, active row,
                  // blocked row — so cells line up horizontally per row.
                  ...data.flatMap((entry) => {
                    const ready  = entry.issues || [];
                    const stuck  = entry.stuck  || [];
                    const behind = entry.behind || [];
                    const blocked = [...stuck, ...behind];
                    // totalReady is the full ready-now count from the

                    const totalReady = Number.isFinite(entry.totalReady)
                      ? entry.totalReady
                      : ready.length;
                    const readyOverflow = Math.max(0, totalReady - ready.length);
                    const totalSuffix = blocked.length ? ` + ${blocked.length}` : "";

                    const renderCard = (issue, extraClass = "") =>
                      React.createElement(
                        "div",
                        {
                          key: issue.id,
                          className: "active-card" + (extraClass ? " " + extraClass : ""),
                          onClick: () => onOpenRepo(entry.repo),
                        },
                        React.createElement("div", { className: "active-id" }, issue.id),
                        React.createElement("div", { className: "active-title" }, issue.title || "(no title)"),
                        React.createElement(
                          "div",
                          { className: "active-meta" },
                          React.createElement(
                            "span",
                            { className: extraClass === "stuck" ? "stuck-status" : null },
                            issue.status || "open",
                          ),
                          React.createElement("span", null, issue.issue_type || issue.type || "task"),
                          React.createElement("span", null, `P${issue.priority ?? "?"}`),
                          React.createElement("span", null, `👤 ${issue.assignee || "(none)"}`),
                        ),
                      );

                    return [
                      // Row 1: project header
                      React.createElement(
                        "div",
                        { key: `proj-${entry.repo}`, className: "active-cell row-project", title: entry.path || entry.repo },
                        React.createElement("div", { className: "active-row-label" }, "Project"),
                        React.createElement(
                          "div",
                          { className: "active-repo", title: entry.path || entry.repo },
                          `${entry.repo} (${totalReady}${totalSuffix})`,
                        ),
                      ),
                      // Row 2: active (ready-now) issues
                      React.createElement(
                        "div",
                        { key: `active-${entry.repo}`, className: "active-cell row-active" },
                        React.createElement(
                          "div",
                          { className: "active-row-label" },
                          readyOverflow > 0
                            ? `Active (${ready.length} of ${totalReady})`
                            : `Active (${totalReady})`,
                        ),
                        ready.length
                          ? React.createElement(
                              "div",
                              { className: "active-list" },
                              ...ready.map((issue) => renderCard(issue)),
                              readyOverflow > 0
                                ? React.createElement(
                                    "div",
                                    {
                                      key: `more-${entry.repo}`,
                                      className: "active-card empty",
                                      onClick: () => onOpenRepo(entry.repo),
                                      style: { cursor: "pointer", fontStyle: "normal" },
                                    },
                                    `+ ${readyOverflow} more — open repo →`,
                                  )
                                : null,
                            )
                          : React.createElement(
                              "div",
                              { className: "active-card empty" },
                              entry.error ? `error: ${entry.error}` : "No ready work",
                            ),
                      ),
                      // Row 3: blocked = stuck + behind, combined and tagged
                      React.createElement(
                        "div",
                        { key: `blocked-${entry.repo}`, className: "active-cell row-blocked" },
                        React.createElement(
                          "div",
                          { className: "active-row-label" },
                          `Blocked (${blocked.length})`,

                        blocked.length
                          ? React.createElement(
                              "div",
                              { className: "active-list" },
                              ...stuck.map((issue) => renderCard(issue, "stuck")),
                              ...behind.map((issue) => renderCard(issue, "behind")),

                              "div",
                              { className: "active-card empty" },
                              "—",

                  }),

            "div",
            { className: "actions" },

    function DetailPanel({ repo, issue, allIssues, edges, ownerOptions, onClose, onChanged, onDeleted, onSelectIssue }) {

      const [type, setType] = useState(issue.issue_type || "task");
      const [status, setStatus] = useState(issue.status || "open");
      const issueRefs = referencesFromLabels(issue.labels);
      const [referencesText, setReferencesText] = useState(issueRefs.join("\n"));
      const [targetDatetime, setTargetDatetime] = useState(targetDateTimeOf(issue));
      const [busy, setBusy] = useState(false);
      const [err, setErr] = useState(null);

      const isClosed = String(issue.status || "").toLowerCase() === "closed";

      const save = async () => {
        if (!title.trim()) return setErr("title is required");
        if (!owner.trim()) return setErr("owner is required");
        const references = parseReferencesText(referencesText);
        setBusy(true);
        setErr(null);
        try {
          const r = await fetch(`/beads/api/issue/${encodeURIComponent(issue.id)}?repo=${encodeURIComponent(repo)}`, {
            method: "PATCH",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              title,
              description,
              priority,
              owner: owner.trim(),
              type,
              status,
              references,
              target_datetime: targetDatetime.trim(),
            }),
          });
          const j = await r.json();
          if (j.error) throw new Error(j.error);
          setEditing(false);
          onChanged(j.issue);
        } catch (e) {
          setErr(String(e?.message ?? e));
        } finally {
          setBusy(false);
        }
      };

      const closeOrReopen = async () => {
        setBusy(true);
        setErr(null);
        try {
          const action = isClosed ? "reopen" : "close";
          const r = await fetch(`/beads/api/issue/${encodeURIComponent(issue.id)}/${action}?repo=${encodeURIComponent(repo)}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({}),
          });
          const j = await r.json();
          if (j.error) throw new Error(j.error);
          onChanged(j.issue);
        } catch (e) {
          setErr(String(e?.message ?? e));
        } finally {
          setBusy(false);
        }
      };

      // ── Dependency management ────────────────────────────────────
      // edges in our DAG: { from: dependent, to: blocker }
      //   so issue.id == from  → this issue depends on edge.to (blocked by it)
      //   so issue.id == to    → this issue is depended on by edge.from (blocks it)

      const blocks    = (edges || []).filter((e) => e.to === issue.id);
      const issueTitleById = new Map((allIssues || []).map((i) => [i.id, i.title || ""]));

        setBusy(true);
        setErr(null);

          const r = await fetch(`/beads/api/deps/edit?repo=${encodeURIComponent(repo)}`, {
            method: "DELETE",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ from, to }),
          });
          const j = await r.json();
          if (j.error) throw new Error(j.error);
          onChanged();
        } catch (e) {
          setErr(String(e?.message ?? e));
        } finally {
          setBusy(false);
        }
      };

      const renderDepRow = (otherId, dir) => {
        const title = (issueTitleById.get(otherId) || "").slice(0, 50);
        return React.createElement(
          "div",
          { key: `${dir}-${otherId}`, className: "dep-row" },
          React.createElement(
            "a",
            { onClick: () => onSelectIssue && onSelectIssue(otherId), title },
            otherId,
            title ? ` — ${title}` : "",

          React.createElement(
            "button",
            {
              className: "x",
              title: "remove dependency",
              onClick: () =>
                dir === "depends"
                  ? removeDep(issue.id, otherId)
                  : removeDep(otherId, issue.id),
              disabled: busy,
            },
            "×",
          ),
        );
      };

      const del = async () => {
        if (!confirm(`Permanently delete ${issue.id}? This cannot be undone.`)) return;
        setBusy(true);
        setErr(null);
        try {
          const r = await fetch(`/beads/api/issue/${encodeURIComponent(issue.id)}?repo=${encodeURIComponent(repo)}`, {
            method: "DELETE",
          });
          const j = await r.json();
          if (j.error) throw new Error(j.error);
          onDeleted(issue.id);
        } catch (e) {
          setErr(String(e?.message ?? e));
          setBusy(false);
        }
      };

      return React.createElement(
        "div",
        { className: "detail" },
        React.createElement("button", { className: "close-x", onClick: onClose, title: "Close panel" }, "×"),
        React.createElement("div", { className: "id" }, issue.id),
        editing
          ? React.createElement("input", {
              value: title,
              onChange: (e) => setTitle(e.target.value),
              placeholder: "Title",
              style: { fontSize: 16, marginTop: 6 },
            })
          : React.createElement("h2", null, issue.title || "(no title)"),
        React.createElement(
          "div",
          { className: "meta" },
          React.createElement(
            "span",
            { style: { color: colorForStatus(issue.status) } },
            issue.status || "open",
          ),
          React.createElement("span", null, issue.issue_type || "task"),
          editing
            ? React.createElement(
                "select",
                {
                  value: priority,
                  onChange: (e) => setPriority(e.target.value),
                  style: { width: "auto" },
                },
                ...PRIORITIES.map((p) =>
                  React.createElement("option", { key: p.v, value: p.v }, p.label),
                ),
              )
            : React.createElement("span", null, `P${issue.priority ?? "?"}`),
          issue.created_at &&
            React.createElement("span", { title: "created" }, issue.created_at.slice(0, 10)),
          targetDateTimeOf(issue) &&
            React.createElement("span", { title: "target datetime" }, `🎯 ${String(targetDateTimeOf(issue)).slice(0, 16)}`),
        ),
        editing
          ? React.createElement(
              React.Fragment,
              null,
              React.createElement("label", null, "Description (markdown)"),
              React.createElement("textarea", {
                value: description,
                onChange: (e) => setDescription(e.target.value),
              }),
              React.createElement("label", null, "Owner *"),
              React.createElement(
                "select",
                { value: owner, onChange: (e) => setOwner(e.target.value) },
                ...ownerOptions.map((o) =>
                  React.createElement("option", { key: o, value: o }, o),
                ),
              ),
              React.createElement(
                "div",
                { style: { display: "flex", gap: 12, marginTop: 4 } },
                React.createElement(
                  "div",
                  { style: { flex: 1 } },
                  React.createElement("label", null, "Status"),
                  React.createElement(
                    "select",
                    { value: status, onChange: (e) => setStatus(e.target.value) },
                    ...STATUSES.map((s) =>
                      React.createElement("option", { key: s, value: s }, labelForStatus(s)),
                    ),
                  ),
                ),
                React.createElement(
                  "div",
                  { style: { flex: 1 } },
                  React.createElement("label", null, "Type"),
                  React.createElement(
                    "select",
                    { value: type, onChange: (e) => setType(e.target.value) },
                    ...ISSUE_TYPES.map((t) =>
                      React.createElement("option", { key: t, value: t }, t),
                    ),
                  ),
                ),
              ),
              React.createElement("label", null, "Target datetime (optional; ISO or bd due syntax)"),
              React.createElement("input", {
                value: targetDatetime,
                onChange: (e) => setTargetDatetime(e.target.value),
                placeholder: "2026-05-02T09:00:00-07:00 or +1d or next monday",
              }),
              React.createElement("label", null, "Reference files (one path per line; optional)"),
              React.createElement("textarea", {
                value: referencesText,
                onChange: (e) => setReferencesText(e.target.value),
                placeholder: "MEMORY.md\nmemory/2026-04-30.md\ndocs/architecture.md",
                style: { minHeight: 80 },
              }),
            )
          : React.createElement(
              React.Fragment,
              null,
              React.createElement(
                "div",
                { className: "meta", style: { marginTop: -4 } },
                React.createElement(
                  "span",
                  { title: "owner", style: { background: "#0f172a", borderColor: "#1e3a8a" } },
                  "👤 ",
                  issue.assignee || "(no owner)",
                ),
                targetDateTimeOf(issue) &&
                  React.createElement(
                    "span",
                    { title: "target datetime", style: { background: "#1f172a", borderColor: "#7c3aed", color: "#ddd6fe" } },
                    "🎯 ",
                    targetDateTimeOf(issue),
                  ),
                ...(issueRefs.length
                  ? issueRefs.map((m) =>
                      React.createElement(
                        "span",
                        { key: m, title: "reference file", style: { background: "#0f172a", borderColor: "#365314", color: "#bef264" } },
                        "📜 ",
                        m,
                      ),
                    )
                  : [React.createElement("span", { key: "_none", style: { color: "#9ca3af" } }, "(no reference files)")]),
              ),
              targetDateTimeOf(issue) &&
                React.createElement(
                  "div",
                  { className: "desc", style: { marginBottom: 10, maxHeight: "none" } },
                  React.createElement("strong", null, "Target datetime: "),
                  targetDateTimeOf(issue),
                ),
              React.createElement(
                "div",
                { className: "desc" },
                issue.description || "(no description)",
              ),
            ),
        err && React.createElement("div", { style: { color: "#fca5a5", fontSize: 12, marginTop: 8 } }, err),
        busy && React.createElement("div", { className: "saving" }, "saving…"),
        // Dependency editor: read-only lists with × removers.

        // anchor on the selected node in the canvas (see node renderer above).
        !editing &&
          React.createElement(
            "div",
            { className: "deps" },
            React.createElement("h3", null, `→ Depends on (${dependsOn.length})`),
            dependsOn.length === 0
              ? React.createElement("div", { className: "dep-empty" }, "(none)")
              : dependsOn.map((e) => renderDepRow(e.to, "depends")),
            React.createElement("h3", { style: { marginTop: 12 } }, `← Blocks (${blocks.length})`),
            blocks.length === 0

              : blocks.map((e) => renderDepRow(e.from, "blocks")),
            React.createElement(
              "div",
              {
                className: "dep-empty",
                style: { marginTop: 10, fontStyle: "normal", color: "#9ca3af" },

              "→ To add a dependency: drag the blue anchor on this node onto another node in the graph.",

        React.createElement(
          "div",
          { className: "actions" },

            ? React.createElement(
                React.Fragment,
                null,

                  "Save",
                ),
                React.createElement(
                  "button",
                  {
                    onClick: () => {
                      setEditing(false);
                      setTitle(issue.title || "");
                      setDescription(issue.description || "");
                      setPriority(String(issue.priority ?? "2"));
                      setOwner(issue.assignee || ownerOptions?.[0] || "any");
                      setType(issue.issue_type || "task");
                      setStatus(issue.status || "open");
                      setReferencesText(referencesFromLabels(issue.labels).join("\n"));
                      setTargetDatetime(targetDateTimeOf(issue));
                    },
                    disabled: busy,

                React.Fragment,
                null,
                React.createElement(
                  "button",

    function CreateModal({ repo, ownerOptions, onClose, onCreated }) {
      const [title, setTitle] = useState("");
      const [description, setDescription] = useState("");
      const [type, setType] = useState("task");
      const [priority, setPriority] = useState("2");
      const [owner, setOwner] = useState(ownerOptions?.[0] || "any");
      const [referencesText, setReferencesText] = useState("");
      const [targetDatetime, setTargetDatetime] = useState("");
      const [busy, setBusy] = useState(false);
      const [err, setErr] = useState(null);

      const submit = async () => {
        if (!title.trim()) return setErr("title is required");
        if (!owner.trim()) return setErr("owner is required");
        const references = parseReferencesText(referencesText);
        setBusy(true);
        setErr(null);
        try {
          const r = await fetch(`/beads/api/issues/create?repo=${encodeURIComponent(repo)}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              title,
              description,
              type,
              priority,
              owner: owner.trim(),
              references,
              target_datetime: targetDatetime.trim(),
            }),
          });
          const j = await r.json();
          if (j.error) throw new Error(j.error);
          onCreated();
        } catch (e) {
          setErr(String(e?.message ?? e));
        } finally {
          setBusy(false);
        }
      };

      return React.createElement(
        "div",
        { className: "modal-bg", onClick: onClose },
        React.createElement(
          "div",
          { className: "modal", onClick: (e) => e.stopPropagation() },
          React.createElement("h2", null, `New issue in ${repo}`),
          React.createElement("label", null, "Title"),
          React.createElement("input", {
            autoFocus: true,
            value: title,
            onChange: (e) => setTitle(e.target.value),
            placeholder: "Short, descriptive title",
          }),
          React.createElement("label", null, "Description (markdown)"),
          React.createElement("textarea", {
            value: description,
            onChange: (e) => setDescription(e.target.value),
            placeholder: "Optional. Supports markdown.",
          }),
          React.createElement("label", null, "Owner * — who is responsible (agent or human)"),
          React.createElement(
            "select",
            { value: owner, onChange: (e) => setOwner(e.target.value) },
            ...ownerOptions.map((o) =>
              React.createElement("option", { key: o, value: o }, o),
            ),
          ),
          React.createElement("label", null, "Target datetime (optional; ISO or bd due syntax)"),
          React.createElement("input", {
            value: targetDatetime,
            onChange: (e) => setTargetDatetime(e.target.value),

          }),
          React.createElement("label", null, "Reference files — one path per line (optional; agents can backfill)"),
          React.createElement("textarea", {
            value: referencesText,
            onChange: (e) => setReferencesText(e.target.value),
            placeholder: "MEMORY.md\nmemory/2026-04-30.md\ndocs/architecture.md",
            style: { minHeight: 80 },
          }),
          React.createElement(
            "div",
            { className: "row" },
            React.createElement(
              "div",
              null,
              React.createElement("label", null, "Type"),
              React.createElement(
                "select",
                { value: type, onChange: (e) => setType(e.target.value) },
                ...ISSUE_TYPES.map((t) =>
                  React.createElement("option", { key: t, value: t }, t),
                ),
              ),
            ),
            React.createElement(
              "div",
              null,
              React.createElement("label", null, "Priority"),
              React.createElement(
                "select",
                { value: priority, onChange: (e) => setPriority(e.target.value) },
                ...PRIORITIES.map((p) =>
                  React.createElement("option", { key: p.v, value: p.v }, p.label),

              ),
            ),
          ),
          err && React.createElement("div", { style: { color: "#fca5a5", fontSize: 12, marginTop: 8 } }, err),
          React.createElement(
            "div",
            { className: "actions" },
            React.createElement("button", { onClick: onClose, disabled: busy }, "Cancel"),
            React.createElement(
              "button",
              { className: "primary", onClick: submit, disabled: busy },
              busy ? "Creating…" : "Create",
            ),
          ),
        ),
      );
    }

    createRoot(document.getElementById("root")).render(React.createElement(App));
  </script>
